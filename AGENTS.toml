# Project-level overrides (higher priority than global config)
# Keep only project-specific fields here.

[project]
name = "codepilot-dev"
base_branch = "dev"

[agents.commands]
claude = "claude"
codex = "codex"
opencode = "opencode"

# 当前项目任务直接在主工作目录执行，不为每个任务新建分支或 worktree。
[automation]
task_workspace = "direct"
per_task_branch = false

[inspect]
signals = ["git_log", "failed_tasks", "todos", "deps", "ruff", "pytest", "code_metrics"]


[providers]

[providers.deepseek]
enabled = false
api_key = ""
model = ""
base_url = "https://api.deepseek.com"
max_tokens = 8192
temperature = 0.7
auto_model_selection = true
simple_model = "deepseek-v4-flash"
complex_model = "deepseek-v4-pro"
thinking = "auto"
reasoning_effort = "auto"
[feishu_bot]
enabled = true
app_id = "cli_a9653cd84db9dcc4"
app_secret = ""
node_command = "node"
default_project = "codepilot-dev"
