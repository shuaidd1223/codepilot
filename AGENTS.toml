# Project-level overrides (higher priority than global config)
# Keep only project-specific fields here.

[project]
name = "codepilot-dev"
base_branch = "dev"

[agents.commands]
claude = "claude"
codex = "codex"
opencode = "opencode"

[opencode.permission]
# 当前项目信任 CodePilot 集成的 OpenCode，会话内不再逐项弹权限确认。
mode = "full_access"

# 当前项目任务直接在主工作目录执行，不为每个任务新建分支或 worktree。
# 以下注释行是所有 [automation] 默认值，供参考；只有未注释的行是此项目的覆盖。
[automation]
planner = "codex"
# default_agent = ""
# task_agent = "dual"
# executor = "builtin"
# auto_execute = true
# confirm_before_execute = false
# auto_commit = true
# max_tasks = 5
# max_retries = 3
per_task_branch = false
task_workspace = "direct"
# two_stage_planning = true
# clarify_vague_requirements = true
# clarify_max_turns = 3
# max_review_rounds = 2
# agent_silence_timeout_seconds = 0
fallback_cli_order = ["codex", "opencode"]

[automation.scheduled_agents.task_health]
enabled = true
agent = "codex"
interval = "10m"
prompt = """
Review local CodePilot task status, failed tasks, stale in-progress work, and recent scheduler audit records.
Summarize risks and suggest conservative next checks.
Do not modify files or call external services.
"""
max_cost_usd = 0.10
max_daily_cost_usd = 0.50

[automation.scheduled_agents.daily_summary]
enabled = true
agent = "codex"
interval = "1d"
prompt = """
Prepare a daily project summary for Feishu delivery if Feishu is configured.
Include completed tasks, failed or risky tasks, and suggested next actions.
Do not send messages yourself and do not include secrets.
"""
max_cost_usd = 0.20
max_daily_cost_usd = 0.80

[automation.scheduled_agents.auto_inspect]
enabled = true
agent = "codex"
interval = "30m"
prompt = """
Run a lightweight project inspection plan using existing CodePilot inspect signals.
Summarize actionable findings and avoid making code changes.
"""
max_cost_usd = 0.15
max_daily_cost_usd = 0.75

[automation.event_agents.failed_task_triage]
enabled = false
trigger = "task.failed"
agent = "codex"
prompt = "Task {{ task_id }} failed with {{ error_message }}. Suggest the smallest repair."
max_cost_usd = 0.10
max_daily_cost_usd = 0.50

[inspect]
signals = ["git_log", "failed_tasks", "todos", "deps", "ruff", "pytest", "code_metrics"]


[providers]

[providers.openai]
enabled = true
api_key = ""
model = "gpt-5.4"
base_url = "https://sub.hdd.sb/v1"
max_tokens = 4096
temperature = 0.7

[providers.deepseek]
enabled = true
api_key = ""
model = ""
base_url = "https://api.deepseek.com"
max_tokens = 8192
temperature = 0.7
auto_model_selection = true
simple_model = "deepseek-v4-flash"
complex_model = "deepseek-v4-pro"
thinking = "auto"
reasoning_effort = "auto"
[feishu_bot]
enabled = true
app_id = "cli_a9653cd84db9dcc4"
app_secret = ""
node_command = "node"
default_project = "codepilot-dev"
