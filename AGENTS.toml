# CodePilot 项目配置文件
# 此文件可选；工具也可通过数据库管理项目

[project]
# 项目标识名（用于 codepilot 命令 --project 参数）
name = "codepilot-dev"
# Git 主分支
base_branch = "dev"
# 默认任务智能体
default_mode = "claude"
# Worktree 隔离目录，空值则自动推导到 ~/.codepilot/worktrees/<project>/
worktree_base = ""

[agents]
# AI Agent 命令
codex_cmd = "codex"
claude_cmd = "claude"

[dispatch]
# 调度间隔（秒）
interval_seconds = 600
# 任务过期时间（分钟），超时未完成自动重置
stale_minutes = 30

[automation]
# 纯文本需求默认使用 Codex 规划和执行
planner = "claude"
executor = "builtin"
# 输入需求后默认直接执行；如果只想先规划，可命令行加 --no-execute
auto_execute = true
# 若为 true，则每次规划后先询问是否执行
confirm_before_execute = false
# 内置执行器成功后自动提交当前任务
auto_commit = true
# 复杂需求最多拆成多少个子任务
max_tasks = 5
# 每个子任务最多重试次数
max_retries = 3
# 为每个任务自动创建 feat/task-<id>-<slug> 分支，成功后合并回 base_branch
per_task_branch = true

[notifications]
# 飞书/企微 Webhook URL
webhook_url = ""
enabled = false
