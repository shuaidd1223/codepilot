# CodePilot 项目配置文件
# 此文件可选；工具也可通过数据库管理项目

[project]
# 项目标识名（用于 codepilot 命令 --project 参数）
name = "codepilot-dev"
# Git 主分支
base_branch = "dev"
# 默认任务智能体：dual = builder=codex（写代码） + reviewer=claude（审核）
default_mode = "dual"
# Worktree 隔离目录，空值则自动推导到 ~/.codepilot/worktrees/<project>/
worktree_base = ""

[agents]
# dual phase 覆盖示例：当 default_mode="dual" 时，可显式指定 builder / reviewer
# builder = "codex"
# reviewer = "claude"
# 注意：这里必须填具体 agent，不能再写 dual；留空则回退到默认 builder=codex、reviewer=claude
# AI Agent 命令
codex_cmd = "codex"
claude_cmd = "claude"

[dispatch]
# 调度间隔（秒）
interval_seconds = 600
# 任务过期时间（分钟），超时未完成自动重置
stale_minutes = 30

[automation]
# 规划走 claude（分析/审核强），执行由 dual 驱动（builder=codex，reviewer=claude）
planner = "claude"
executor = "builtin"
# 输入需求后默认直接执行；如果只想先规划，可命令行加 --no-execute
auto_execute = true
# 若为 true，则每次规划后先询问是否执行
confirm_before_execute = false
# 内置执行器成功后自动提交当前任务
auto_commit = true
# 复杂需求最多拆成多少个子任务
max_tasks = 5
# 每个子任务最多重试次数
max_retries = 3
# builder ↔ reviewer 闭环最大轮数；reviewer 判 FAIL 时 builder 会收到意见继续迭代
max_review_rounds = 4
# 为每个任务自动创建 feat/task-<id>-<slug> 分支，成功后合并回 base_branch
per_task_branch = true

[inspect]
# 定时巡检开关；开启后配合 `codepilot daemon` 会自动周期扫描
enabled = true
# 巡检规划走 claude，和 [automation].planner 保持一致
planner = "claude"
# 每多久跑一轮（秒）
interval_seconds = 1800
# 每轮最多产出几条候选任务
max_new_tasks_per_round = 3
# 使用哪些信号
signals = ["git_log", "failed_tasks", "todos"]
# 巡检产生的任务是否立即进入执行（false 仅入 backlog 等待人工确认）
auto_execute = false
# 巡检任务默认优先级
priority = "P3"

[notifications]
# 飞书/企微 Webhook URL
webhook_url = ""
enabled = false
