# CodePilot 项目配置文件
# 由 `codepilot config sync` 生成/同步。

# 项目配置。name 用于 `codepilot -p/--project`；base_branch 是任务分支合并回去的主分支。
[project]
# 项目名称，默认取 AGENTS.toml 所在目录名。
name = "codepilot-dev"
# Git 主分支/基准分支。
base_branch = "dev"
# 默认任务智能体，例如 codex、claude、dual。
default_mode = "dual"
# worktree 隔离目录；留空时自动推导到 ~/.codepilot/data/<project>/worktrees/。
worktree_base = ""

# Shell 配置。preferred 留 auto 时自动检测；路径留空表示使用 PATH 中的命令。
[shell]
# auto / powershell / pwsh / powershell7 / bash / zsh / sh。
preferred = "auto"
# 自定义 PowerShell 可执行文件路径；留空表示自动查找。
powershell_path = ""
# 自定义 Bash 可执行文件路径；留空表示自动查找。
bash_path = ""

# 本地 CLI Agent 配置。planner/builder/reviewer 留空时使用对应场景默认值。
[agents]
# Codex CLI 命令名或完整路径。
codex_cmd = "codex"
# Claude CLI 命令名或完整路径。
claude_cmd = "claude"
# 通用规划器；留空时使用场景默认值。
planner = ""
# dual 模式 builder；留空时默认 codex。
builder = ""
# dual 模式 reviewer；留空时默认 claude。
reviewer = ""

# 外部 dispatch 执行器配置。builtin 执行器也会读取 stale_minutes 等通用超时语义。
[dispatch]
# task-dispatch 脚本路径；留空时先查 ~/.codepilot/data/<project>/scripts/，再查包内置脚本。
dispatch_path = ""
# 轮询间隔秒数。
interval_seconds = 600
# 任务无心跳超过该分钟数后视为过期。
stale_minutes = 30

# 自动规划与执行配置。
# task_workspace: direct=主工作区直接改；branch=主工作区临时分支；worktree=独立临时 worktree。
[automation]
# 自然语言需求默认规划器。
planner = "claude"
# auto / dispatch / builtin。
executor = "builtin"
# 输入需求后是否自动开始执行。
auto_execute = true
# 交互终端下规划完成后是否先确认。
confirm_before_execute = false
# 内置执行器成功后是否自动提交。
auto_commit = true
# 复杂需求最多拆分出的子任务数。
max_tasks = 5
# 单个子任务失败后的最大重试次数。
max_retries = 3
# 是否为任务创建独立执行分支；false 时按当前工作区执行。
per_task_branch = true
# direct / branch / worktree；缺失或非法值默认 branch。
task_workspace = "branch"
# 规划前先侦察代码，再拆任务。
two_stage_planning = true
# 需求模糊时先反问澄清。
clarify_vague_requirements = true
# 最多澄清轮数，达到后按当前信息规划。
clarify_max_turns = 3
# Builder/Reviewer 闭环最大轮数；1 等于关闭闭环。
max_review_rounds = 4
# CLI 连续无输出多少秒后终止；0 表示关闭保护。
agent_silence_timeout_seconds = 0

# 意图分类/问答/澄清用的模型。provider 留空时走本地 CLI 兜底。
# model 留空时使用 [providers.<provider>].model 或内置 provider 默认模型。
[classifier]
# API provider key，例如 openai-gpt4o、claude-sonnet、deepseek；留空走本地 CLI。
provider = ""
# 覆盖分类/问答/澄清模型；留空使用 provider.model。
model = ""
# false 时跳过意图分类，输入默认当作需求处理。
enabled = true
# 分类/澄清 API 或 CLI 调用超时时间秒数。
timeout = 30

# 定时/手动巡检配置。planner 留空时按 显式参数 > [agents].planner > codex 解析。
[inspect]
# 是否启用 daemon 定时巡检。
enabled = true
# 巡检间隔秒数。
interval_seconds = 1800
# 每轮巡检最多新增候选任务数。
max_new_tasks_per_round = 3
# 巡检输入信号，可包含 git_log、failed_tasks、todos、ruff、pytest。
signals = ["git_log", "failed_tasks", "todos"]
# 巡检新增任务后是否自动执行。
auto_execute = false
# 巡检新增任务默认优先级。
priority = "P3"
# 巡检专用 planner；留空时回退到 [agents].planner / codex。
planner = "claude"

# AI Provider API 配置。api_key 可留空改用环境变量；base_url/model 可接自定义兼容接口。
[providers]

# 常用 provider 示例。需要启用时取消对应小节注释；已配置的小节会在下方以实际值输出。

# openai-gpt4o (示例)
# [providers.openai-gpt4o]
# enabled = true
# model = "gpt-4o"
# base_url = ""
# api_key = ""
# max_tokens = 4096
# temperature = 0.7

# claude-sonnet (示例)
# [providers.claude-sonnet]
# enabled = true
# model = "claude-sonnet-4-20250514"
# base_url = ""
# api_key = ""
# max_tokens = 4096
# temperature = 0.7

# hunyuan (示例)
# [providers.hunyuan]
# enabled = false
# model = "hunyuan"
# base_url = "https://hunyuan.cloud.tencent.com"
# api_key = ""
# max_tokens = 4096
# temperature = 0.7

# qwen (示例)
# [providers.qwen]
# enabled = false
# model = "qwen-plus"
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
# api_key = ""
# max_tokens = 4096
# temperature = 0.7

# deepseek (示例)
# [providers.deepseek]
# enabled = false
# model = "deepseek-chat"
# base_url = "https://api.deepseek.com"
# api_key = ""
# max_tokens = 4096
# temperature = 0.7

# ollama (示例)
# [providers.ollama]
# enabled = false
# model = "llama3"
# base_url = "http://localhost:11434/v1"
# api_key = ""
# max_tokens = 4096
# temperature = 0.7

# 通知配置。enabled=false 时 webhook_url 会被保留但不会发送。
[notifications]
# 飞书/企微等 Webhook URL。
webhook_url = ""
# 是否发送通知。
enabled = false
